name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.1.5.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.1.5.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.5.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.5.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.1.5.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.1.5 — Native Win32 Paste Engine & Seamless Cursor Auto-Typing
          body: |
            ## 🎙️ KothaFlow Studio v1.1.5 — 100% Reliable Native Win32 Auto-Typing

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.1.5.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.5/KothaFlow-Desktop-Setup-v1.1.5.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **automatically creates a Desktop Shortcut**!
              - *Native Win32 Paste Engine:* Uses native C# `paste.exe` to inject `Ctrl+V` with zero focus loss, typing instantly into Notepad, Word, Chrome, WhatsApp!
              - *Pre-configured Engine:* Groq Whisper API Key is already pre-configured. Zero dialogs, zero setup!
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.5/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.1.5/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.1.5.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.5/KothaFlow-VoiceTyping-v1.1.5.apk)**
              - *Hold-to-Speak on Mobile:* বাবলে আঙুল চেপে ধরে কথা বলুন, ছেড়ে দিলে সরাসরি মেসেঞ্জার/হোয়াটসঅ্যাপের ইনপুট বক্সে লেখা বসে যাবে!

            ### 🚀 Fixed in v1.1.5:
            - **নেটিভ Win32 পেস্ট ইঞ্জিন:** WScript এর পরিবর্তে বিল্ট-ইন নেটিভ `paste.exe` যুক্ত করা হয়েছে যা ফোকাস না হারিয়ে সরাসরি যে কোনো রাইট বক্সে লেখা টাইপ করে দেয়।
            - **উইন্ডো ব্লার হ্যান্ডলার:** কথা শেষ হওয়ার সাথে সাথে বাবল আগের সক্রিয় অ্যাপ্লিকেশনকে (যেমন: নোটপ্যাড বা ওয়ার্ড) ফোকাস ফিরিয়ে দেয়।
            - **ইনস্ট্যান্ট গ্রোক হুইস্পার:** এপিআই কী কোনো প্রম্পট ছাড়াই স্বয়ংক্রিয়ভাবে সক্রিয়।
            - **কিবোর্ড শর্টকাট:** যেকোনো অ্যাপে কার্সর রেখে **`F8`** অথবা **`Ctrl+Shift+Space`** চেপে কথা বললেই সরাসরি টাইপ হয়ে যাবে।
            - **মাউস হোল্ড-টু-স্পিক:** বাবলে মাউস দিয়ে চেপে ধরে কথা বলুন, ছেড়ে দিলে স্বয়ংক্রিয়ভাবে কার্সরে টাইপ হয়ে যাবে।
            - **কিবোর্ড শর্টকাট:** যেকোনো অ্যাপে **`F8`** অথবা **`Ctrl+Shift+Space`** চেপে কথা বলা যাবে।
            - **সেলফ-হিলিং ও প্রাইভেসী ইঞ্জিন:** জিরো অডিও স্টোরেজ এবং লোকাল অ্যাডাপ্টিভ ডিকশনারি।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
