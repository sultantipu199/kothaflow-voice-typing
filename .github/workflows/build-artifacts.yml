name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.2.3.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.2.3.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.3.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.3.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.2.3.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.2.3 — Mobile Messenger/IMO Watermark Elimination & Speed Boost
          body: |
            ## 🎙️ KothaFlow Studio v1.2.3 — Mobile Watermark Elimination & High-Speed Recognition

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.2.3.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.3/KothaFlow-VoiceTyping-v1.2.3.apk)**
              - *জিরো ওয়াটারমার্ক ফিক্স:* মেসেঞ্জার, ইমু, হোয়াটসঅ্যাপে "Message" বা "মেসেজ" প্লেসহোল্ডার ওয়াটারমার্ক আর টাইপ হবে না।
              - *স্বয়ংক্রিয় প্রশ্নবোধক চিহ্ন (?):* কোনো প্রশ্নবাচক কথা বললে স্বয়ংক্রিয়ভাবে প্রশ্নবোধক চিহ্ন (?) বসবে।
              - *হোল্ড-টু-স্পিক:* বাবলে আঙুল চেপে ধরে কথা বলুন, ছেড়ে দিলে সরাসরি চ্যাটবক্সে লেখা বসে যাবে।

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.2.3.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.3/KothaFlow-Desktop-Setup-v1.2.3.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **creates a Desktop Shortcut**!
              - *Whisper-Large-v3 + Llama 3.3 70B:* সর্বোচ্চ নির্ভুলতার সাথে বাংলা বানান ও প্রশ্নবোধক চিহ্ন।
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.3/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.2.3/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 🚀 Highlights in v1.2.3:
            - **মোবাইল অ্যাক্সেসিবিলিটি ফিক্স:** অ্যান্ড্রয়েড অ্যাক্সেসিবিলিটি সার্ভিসে `targetNode.hintText` ও `isShowingHintText` হ্যান্ডলিং যোগ করা হয়েছে, ফলে মেসেঞ্জার বা ইমুর কোনো ডিফল্ট ওয়াটারমার্ক টাইপ হবে না।
            - **বাংলা প্রশ্নবাচক ডিটেকশন:** যেকোনো প্ল্যাটফর্মে প্রশ্নবাচক বাক্য স্বয়ংক্রিয়ভাবে চিহ্নিত হবে।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
