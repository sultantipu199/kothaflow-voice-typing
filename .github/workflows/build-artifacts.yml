name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.1.7.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.1.7.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.7.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.7.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.1.7.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.7
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.1.7 — Zero-Limit Dual-Model Auto-Failover & Strict Privacy
          body: |
            ## 🎙️ KothaFlow Studio v1.1.7 — Unlimited Usage, Dual-Engine Failover & Strict Privacy

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.1.7.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.7/KothaFlow-Desktop-Setup-v1.1.7.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **creates a Desktop Shortcut**!
              - *Zero Limit Failover:* Automatic multi-model fallback (`whisper-large-v3` ➔ `whisper-large-v3-turbo` ➔ 27B AI Brain) with non-expiring Groq key.
              - *Strict Zero-Disk Privacy:* RAM-only audio buffers, zero audio stored on disk, 100% encrypted direct TLS 1.3 connection.
              - *Native Win32 Paste Engine:* Uses native C# `paste.exe` to inject text instantly into any active cursor!
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.7/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.1.7/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.1.7.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.7/KothaFlow-VoiceTyping-v1.1.7.apk)**
              - *Unlimited & Free Native Engine:* Runs on Android native voice engine with zero tokens, zero expiration, and 100% offline/online reliability.

            ### 🚀 Fixed & Built in v1.1.7:
            - **আনলিমিটেড ব্যবহারের সুরক্ষা (Zero Limits):** ডুয়াল-মডেল অটোমেটিক ফেইলওভার যুক্ত করা হয়েছে। প্রাইমারি মডেলে চাপ পড়লে স্বয়ংক্রিয়ভাবে টার্বো মডেলে শিফট হয়ে নিরবচ্ছিন্ন টাইপিং চালু রাখে।
            - **১০০% কঠোর প্রাইভেসী প্রোটেকশন:** কোনো ভয়েস রেকর্ড ডিস্কে বা সার্ভারে জমা হয় না। মেমোরিতে প্রসেস হয়ে সাথে সাথে ওয়াইপ হয়ে যায়।
            - **অটোমেটিক অ্যাটমিক অডিও রেকর্ডিং:** অডিও করাপশন বা "could not process" ত্রুটি পুরোপুরি নির্মূল করা হয়েছে।
            - **কিবোর্ড শর্টকাট:** যেকোনো অ্যাপে কার্সর রেখে **`F8`** অথবা **`Ctrl+Shift+Space`** চেপে কথা বললেই সরাসরি টাইপ হয়ে যাবে।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
