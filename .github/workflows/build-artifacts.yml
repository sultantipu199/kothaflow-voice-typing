name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.2.2.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.2.2.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.2.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.2.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.2.2.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.2.2 — Enhanced Question Punctuation (?) & Watermark Elimination
          body: |
            ## 🎙️ KothaFlow Studio v1.2.2 — Question Mark Auto-Insertion & Clean Insertion

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.2.2.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.2/KothaFlow-Desktop-Setup-v1.2.2.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **creates a Desktop Shortcut**!
              - *স্বয়ংক্রিয় প্রশ্নবোধক চিহ্ন (?):* কোনো প্রশ্নবাচক কথা বললেই স্বয়ংক্রিয়ভাবে প্রশ্নবোধক চিহ্ন বসে যাবে।
              - *ক্লিন ইনপুট (Zero Watermark / Zero Prefix):* মেসেঞ্জার, ইমু বা যেকোনো চ্যাটবক্সের ওয়াটারমার্ক বা লেবেল ("মেসেজ:", "Message:") কখনোই টাইপ হবে না। শুধু আপনার কণ্ঠের আসল কথাটুকু টাইপ হবে।
              - *Whisper-Large-v3 + Llama 3.3 70B:* সর্বোচ্চ নির্ভুলতার সাথে বাংলা বানান ও যুক্তবর্ণ শুদ্ধকরণ।
              - *Native Win32 Paste Engine:* Instantly types speech directly into active text field in Notepad, Word, Chrome, WhatsApp!
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.2/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.2.2/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.2.2.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.2/KothaFlow-VoiceTyping-v1.2.2.apk)**
              - *Hold-to-Speak on Mobile:* বাবলে আঙুল চেপে ধরে কথা বলুন, ছেড়ে দিলে সরাসরি মেসেঞ্জার/হোয়াটসঅ্যাপের ইনপুট বক্সে লেখা বসে যাবে!

            ### 🚀 Highlights in v1.2.2:
            - **প্রশ্নবোধক চিহ্ন (?) স্বয়ংক্রিয় সংযোজন:** "কী", "কেন", "কোথায়", "কখন", "কিভাবে", "কেমন" ইত্যাদি প্রশ্নবাচক বাক্য শনাক্ত করে স্বয়ংক্রিয়ভাবে প্রশ্নবোধক চিহ্ন (?) বসানো হবে।
            - **মেসেঞ্জার ও ইমু ওয়াটারমার্ক রিমুভাল:** এআই বা সিস্টেমের কোনো কৃত্রিম প্রিফিক্স (যেমন "মেসেজ:", "বার্তা:", "Message:") টাইপ হবে না, কেবল ব্যবহারকারীর উচ্চারিত কণ্ঠস্বরই টাইপ হবে।
            - **উন্নত অডিও ক্যাপচার ও ফিল্টারিং:** নয়েজ ক্যান্সেলেশন ও গেইন কন্ট্রোল আরও শক্তিশালী করা হয়েছে।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
