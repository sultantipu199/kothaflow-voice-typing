name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.2.7.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.2.7.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.7.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.7.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = (Get-Command csc.exe -ErrorAction SilentlyContinue).Source
          if (-not $csc -or -not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          }
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
            & $csc /target:winexe /out:alt-hook.exe AltHook.cs
          }
          if (-not (Test-Path "alt-hook.exe")) {
            Write-Error "alt-hook.exe failed to compile!"
            exit 1
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.2.7.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.2.7 — Direct In-Place Voice Typing & Play Protect Clean Accessibility Config
          body: |
            ## 🎙️ KothaFlow Studio v1.2.7 — Direct Write Box Auto-Type & Play Protect Clean

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.2.7.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.7/KothaFlow-VoiceTyping-v1.2.7.apk)**
              - *সরাসরি রাইট বক্সে টাইপিং:* কোনো ক্লিপবোর্ড বা কপি-পেস্ট ছাড়া সরাসরি মেসেঞ্জার, ইমু, হোয়াটসঅ্যাপের বক্সে তাৎক্ষণিকভাবে কথা টাইপ হবে।
              - *প্লে প্রটেক্ট ক্লিন অ্যাক্সেসিবিলিটি কনফিগারেশন:* পূর্বের ঝুঁকিপূর্ণ `typeAllMask` সরিয়ে সুনির্দিষ্ট `typeViewFocused` ইভেন্ট ফিল্টার ব্যবহার করা হয়েছে, ফলে প্লে প্রটেক্ট একে ক্ষতিকর স্ক্রিন রেকর্ডার বা স্পাইওয়্যার ভাববে না।
              - *দ্বিভাষিক ভয়েস টাইপিং:* বাংলা ও ইংরেজি উভয় ভাষায় নির্ভুল টাইপিং।
              - *স্মার্ট প্রশ্নবোধক চিহ্ন (?):* প্রশ্নের শেষে স্বয়ংক্রিয় প্রশ্নবোধক চিহ্ন।

            ### 💻 Desktop (Windows):
            - **[KothaFlow-Desktop-Setup-v1.2.7.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.7/KothaFlow-Desktop-Setup-v1.2.7.exe)**
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.7/KothaFlow-Desktop-Portable.exe)**
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.2.7/KothaFlow-Desktop-Windows-v1.0.zip)**
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
