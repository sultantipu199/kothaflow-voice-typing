name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.0.3.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.0.3.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.3.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.3.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compress Desktop Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/KothaFlow-Desktop-Windows-v1.0.zip
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.0.3 — Restricted Settings Fix & Floating Voice Bubble
          body: |
            ## 🎙️ KothaFlow Studio v1.0.3 — Direct Download Links

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.0.3.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3/KothaFlow-VoiceTyping-v1.0.3.apk)**
              - *Installation:* Download APK to your phone, tap to install, and open KothaFlow Studio.
              - *Android 13/14 'Controlled by restricted setting' Solution:* Tap the "🔓 ১-ক্লিকে App Info খুলুন" button inside the app, tap the top-right 3 dots (⋮) and select "Allow restricted settings". Then toggle Accessibility ON!
              - *Keep your Google Keyboard (Gboard):* The floating mic bubble stays on your screen ready to dictate into Messenger, WhatsApp, Chrome with 1 tap!

            ### 💻 Desktop (Windows):
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.3/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Installation:* Extract ZIP on your PC, double-click `run-windows.bat`. Press `Ctrl+Shift+Space` in any app to dictate!
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
