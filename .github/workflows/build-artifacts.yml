name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*-debug.apk build-output/KothaFlow-VoiceTyping-v1.0.apk || cp android/app/build/outputs/apk/debug/*.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/KothaFlow-VoiceTyping-v1.0.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compress Desktop Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/KothaFlow-Desktop-Windows-v1.0.zip
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.0.0 — Android APK & Desktop Release
          body: |
            ## 🎙️ KothaFlow Studio — Direct Download Links

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/KothaFlow-VoiceTyping-v1.0.apk)**
              - *Installation:* Download APK to your phone, install it, open the KothaFlow app from your app drawer, and follow the 2-step setup wizard!
              - *Usage in Messenger/WhatsApp:* Tap any chat text box, switch to KothaFlow keyboard, and tap the big mic button to speak.

            ### 💻 Desktop (Windows):
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.0/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Installation:* Extract ZIP on your PC, double-click `run-windows.bat`. Press `Ctrl+Shift+Space` in any app to dictate!
          files: release-files/**
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
