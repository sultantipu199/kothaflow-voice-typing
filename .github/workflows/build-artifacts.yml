name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.1.8.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.1.8.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.8.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.8.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.1.8.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.1.8 — 100% Rock-Solid Audio Capture, Universal Mic Support & Instant Auto-Typing
          body: |
            ## 🎙️ KothaFlow Studio v1.1.8 — Complete Zero-Crash Audio & Instant Voice Typing

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.1.8.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.8/KothaFlow-Desktop-Setup-v1.1.8.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **automatically creates a Desktop Shortcut**!
              - *Universal Microphone Support:* Universal audio capture compatible with all laptop/desktop microphone drivers.
              - *Pre-loaded Non-Expiring Key:* Built-in Groq key initialization, never runs empty.
              - *Native Win32 Paste Engine:* Directly types into Notepad, Word, Chrome, WhatsApp with zero focus loss!
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.8/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.1.8/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.1.8.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.8/KothaFlow-VoiceTyping-v1.1.8.apk)**
              - *Hold-to-Speak on Mobile:* বাবলে আঙুল চেপে ধরে কথা বলুন, ছেড়ে দিলে সরাসরি মেসেঞ্জার/হোয়াটসঅ্যাপের ইনপুট বক্সে লেখা বসে যাবে!

            ### 🚀 Fixed & Perfected in v1.1.8:
            - **ইউনিভার্সাল মাইক্রোফোন অডিও ড্রাইভার ফিক্স:** ওভারকনস্ট্রেইন্ড এরর দূর করে সব ল্যাপটপ মাইক্রোফোনে ১০০% সক্রিয় করা হয়েছে।
            - **ইন-মেমোরি অটো-কি লোডার:** কী কখনো খালি থাকবে না, সার্বক্ষণিক সক্রিয় থাকবে।
            - **টাইপিং অ্যান্ড ফোকাস রিট্রিভাল:** কথা বলা শেষ হওয়ামাত্রই বাবল ফোকাস ফিরিয়ে দিয়ে সরাসরি কার্সরে টাইপ করে দেবে।
            - **কিবোর্ড শর্টকাট:** যেকোনো উইন্ডোতে কার্সর রেখে **`F8`** অথবা **`Ctrl+Shift+Space`** চেপে কথা বললেই সরাসরি টাইপ হয়ে যাবে।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
