name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.1.1.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.1.1.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.1.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.1.1.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        run: |
          cd desktop
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.1.1.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.1.1 — Auto-Healing & Self-Evolving Voice Typing (Safe & Privacy-First)
          body: |
            ## 🎙️ KothaFlow Studio v1.1.1 — Auto-Healing & Self-Evolving Engine

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.1.1.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.1/KothaFlow-Desktop-Setup-v1.1.1.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow with 1 click and **automatically creates a Desktop Shortcut icon** on your Windows desktop!
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.1.1/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation. Also auto-creates a Desktop shortcut on launch!
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.1.1/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.1.1.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.1/KothaFlow-VoiceTyping-v1.1.1.apk)**
              - *Hold-to-Speak on Mobile:* বাবলে আঙুল চেপে ধরে কথা বলুন, ছেড়ে দিলে সরাসরি মেসেঞ্জার/হোয়াটসঅ্যাপের ইনপুট বক্সে লেখা বসে যাবে!

            ### 🛡️ Auto-Healing & Self-Evolution Features:
            - **Process Watchdog & Auto-Healing:** ব্যাকগ্রাউন্ড স্পিচ ইঞ্জিনে কোনো সমস্যা হলে ১.৫ সেকেন্ডের মধ্যে নিজে থেকেই অটো-রিস্টার্ট ও রিকানেক্ট করে নেয়।
            - **Adaptive Local Vocabulary (Self-Evolving):** ইউজারের বলা শব্দ ও ফ্রেজ লোকালি ডিভাইসের ভেতরে সুরক্ষিতভাবে শেখে, ফলে প্রতিনিয়ত ব্যবহারের সাথে সাথে একিউরেসি নিজে থেকেই বৃদ্ধি পায়।
            - **Privacy & Safety First:** কোনো ভয়েস অডিও ডিস্কে সেভ হয় না এবং কোনো ক্লাউড ট্র্যাকিং নেই। ১০০% লোকাল এবং নিরাপদ।
            - **Future-Proof Update Checker:** ১-ক্লিকে নতুন আপডেট চেক ও ইনস্টল করার সুবিধা।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
