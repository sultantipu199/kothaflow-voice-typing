name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.0.9.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.0.9.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.9.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.9.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        run: |
          cd desktop
          npm install
          npx electron-builder --win portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $exeFile = Get-ChildItem -Path desktop/dist/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exeFile) {
            Copy-Item $exeFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.0.9 — Direct Auto-Typing in Active Input Box (Desktop & Mobile)
          body: |
            ## 🎙️ KothaFlow Studio v1.0.9 — Direct Download Links

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.0.9/KothaFlow-Desktop-Portable.exe)**
              - *Easiest 1-Click Run:* Just download and double-click! NO Node.js required, NO installation required, NO zip extraction needed. Opens immediately as a watery floating bubble!
              - *Direct Auto-Typing:* Automatically types directly into the write box (Notepad, Word, WhatsApp, Chrome, etc.) at the cursor!
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.9/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Alternative Zip Bundle:* Extract and double-click `run-windows.bat`. Works on any Windows laptop.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.0.9.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.9/KothaFlow-VoiceTyping-v1.0.9.apk)**
              - *Features:* Direct writing into active input box in Messenger, WhatsApp, Chrome, Notes; custom avatar icon; watery translucent bubble; free dragging anywhere on screen!
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
