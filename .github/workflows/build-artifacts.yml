name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.2.6.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.2.6.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.6.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.2.6.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package & Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Portable Windows EXE & Bundle
        shell: pwsh
        env:
          GROQ_SECRET_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd desktop
          if ($env:GROQ_SECRET_KEY) {
            Set-Content -Path "groq_key.txt" -Value $env:GROQ_SECRET_KEY -NoNewline
          }
          $csc = (Get-Command csc.exe -ErrorAction SilentlyContinue).Source
          if (-not $csc -or -not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          }
          if (Test-Path $csc) {
            & $csc /target:winexe /out:paste.exe PasteHelper.cs
            & $csc /target:winexe /out:alt-hook.exe AltHook.cs
          }
          if (-not (Test-Path "alt-hook.exe")) {
            Write-Error "alt-hook.exe failed to compile!"
            exit 1
          }
          npm install
          npx electron-builder --win nsis portable --publish never
          cd ..
          New-Item -ItemType Directory -Force -Path build-output
          $setupFile = Get-ChildItem -Path desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination build-output/KothaFlow-Desktop-Setup-v1.2.6.exe -Force
          }
          $portableFile = Get-ChildItem -Path desktop/dist/*portable*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $portableFile) {
            $portableFile = Get-ChildItem -Path desktop/dist/*.exe -Exclude *Setup* -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($portableFile) {
            Copy-Item $portableFile.FullName -Destination build-output/KothaFlow-Desktop-Portable.exe -Force
          }
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/*.*
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.2.6 — Multilingual (Bangla & English) Voice Typing & Play Protect Clean APK
          body: |
            ## 🎙️ KothaFlow Studio v1.2.6 — Multilingual Bengali & English Typing + Safe Mobile Install

            ### 💻 Desktop (Windows Laptop / PC):
            - **[KothaFlow-Desktop-Setup-v1.2.6.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.6/KothaFlow-Desktop-Setup-v1.2.6.exe)**
              - *1-Click Windows Installer:* Installs KothaFlow and **creates a Desktop Shortcut**!
              - *উভয় ভাষা সাপোর্ট (বাংলা ও ইংরেজি):* এখন বাংলায় বললে খাঁটি বাংলা এবং ইংরেজিতে বললে সঠিক বানান ও ক্যাপিটালাইজেশনসহ নিখুঁত ইংরেজি টাইপ হবে।
              - *১-ক্লিক ভাষা পরিবর্তন:* বাবলের 'বা / EN' ব্যাজে ক্লিক করেই সরাসরি ভাষা পরিবর্তন করা যাবে।
              - *Left Alt হটকি (Wispr Flow স্টাইল):* কীবোর্ডের `Left Alt` একবার ট্যাপ অথবা হোল্ড করে কথা বললেই সরাসরি কার্সরে পেস্ট হবে।
            - **[KothaFlow-Desktop-Portable.exe](https://github.com/${{ github.repository }}/releases/download/v1.2.6/KothaFlow-Desktop-Portable.exe)**
              - *Standalone Portable:* Runs instantly without installation.
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.2.6/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Zip Bundle:* Extract and double-click `run-windows.bat`.

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.2.6.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.6/KothaFlow-VoiceTyping-v1.2.6.apk)**
              - *Play Protect ক্লিন ইনস্টলেশন:* অনাবশ্যক IME পারমিশন মুক্ত করে V1/V2/V3 ডিজিটাল সিগনেচার দিয়ে সাইন করা হয়েছে।
              - *বাইলিঙ্গুয়াল ভয়েস টাইপিং:* বাংলা এবং ইংরেজি উভয় ভাষায় সরাসরি মেসেঞ্জার, ইমু, হোয়াটসঅ্যাপে টাইপ হবে।
              - *স্মার্ট প্রশ্নবোধক চিহ্ন (?):* বাংলা ও ইংরেজি উভয় প্রশ্নের শেষে স্বয়ংক্রিয় প্রশ্নবোধক চিহ্ন বসবে।

            ### 🚀 Highlights in v1.2.6:
            - **মাল্টি-ল্যাঙ্গুয়েজ ফিক্স:** ভাষা লক খুলে দেওয়া হয়েছে; বাংলা ও ইংরেজি দুটোই এখন শতভাগ নির্ভরযোগ্যভাবে টাইপ হবে।
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
