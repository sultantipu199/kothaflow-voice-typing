name: Build KothaFlow Mobile APK & Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*-release.apk build-output/KothaFlow-VoiceTyping-v1.0.6.apk || cp android/app/build/outputs/apk/release/*.apk build-output/KothaFlow-VoiceTyping-v1.0.6.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.6.apk build-output/KothaFlow-VoiceTyping-latest.apk
          cp build-output/KothaFlow-VoiceTyping-v1.0.6.apk build-output/KothaFlow-VoiceTyping-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: build-output/*.apk
          retention-days: 30

  build-desktop:
    name: Build Desktop Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compress Desktop Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Compress-Archive -Path desktop/* -DestinationPath build-output/KothaFlow-Desktop-Windows-v1.0.zip -Force

      - name: Upload Desktop Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: build-output/KothaFlow-Desktop-Windows-v1.0.zip
          retention-days: 30

  release:
    name: Create GitHub Release & Direct Download Links
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Android-APK
          path: release-files

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: KothaFlow-Desktop-Windows-Bundle
          path: release-files

      - name: Display Release Files
        run: ls -la release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          target_commitish: ${{ github.sha }}
          name: KothaFlow v1.0.6 — Free Draggable Bubble & Hide Controls (Mobile + Desktop)
          body: |
            ## 🎙️ KothaFlow Studio v1.0.6 — Direct Download Links

            ### 📱 Mobile (Android):
            - **[KothaFlow-VoiceTyping-v1.0.6.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.6/KothaFlow-VoiceTyping-v1.0.6.apk)**
              - *Free Screen Draggability:* Smoothly drag the watery bubble anywhere across your phone screen and place it wherever you want!
              - *Long-Press Controls:* Long press the bubble to toggle language or manage it. Tap notification to hide or close anytime.
              - *Custom Avatar Icon:* Your custom portrait with a watery translucent glow.
              - *Direct Auto-Typing:* Real-time typing directly into Messenger, WhatsApp, Chrome, Facebook, etc.

            ### 💻 Desktop (Windows):
            - **[KothaFlow-Desktop-Windows-v1.0.zip](https://github.com/${{ github.repository }}/releases/download/v1.0.6/KothaFlow-Desktop-Windows-v1.0.zip)**
              - *Draggable Anywhere:* Click & drag the watery bubble anywhere on your monitors with 60fps precision!
              - *Right-Click Menu:* Right click to hide bubble, switch language, or exit.
          files: release-files/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
