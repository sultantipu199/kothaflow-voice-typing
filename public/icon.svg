<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Sound Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-opacity="0.35" />

  <!-- Microphone Center Graphic with Glow -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="220" y="140" width="72" height="136" rx="36" fill="url(#brandGrad)" />
    
    <!-- Mic Pickup Arc -->
    <path d="M 180 230 C 180 300, 332 300, 332 230" fill="none" stroke="url(#brandGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Stand Stem -->
    <line x1="256" y1="300" x2="256" y2="350" stroke="url(#brandGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Stand Base -->
    <line x1="200" y1="350" x2="312" y2="350" stroke="url(#brandGrad)" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Voice Wave Bars Left & Right -->
  <rect x="120" y="220" width="12" height="72" rx="6" fill="#38bdf8" opacity="0.8" />
  <rect x="144" y="190" width="12" height="132" rx="6" fill="#60a5fa" opacity="0.9" />
  
  <rect x="356" y="190" width="12" height="132" rx="6" fill="#a78bfa" opacity="0.9" />
  <rect x="380" y="220" width="12" height="72" rx="6" fill="#818cf8" opacity="0.8" />

  <!-- Subtle Flow Dot Indicator -->
  <circle cx="370" cy="120" r="14" fill="#10b981" />
  <circle cx="370" cy="120" r="22" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
</svg>
