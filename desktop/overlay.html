<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>KothaFlow Floating Voice Bubble</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* 1. Compact Watery Idle Bubble */
    #idleBubble {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(15, 23, 42, 0.35) 100%);
      border: 1.5px solid rgba(224, 242, 254, 0.45);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      position: relative;
      opacity: 0.35;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    #idleBubble:active {
      cursor: grabbing;
      opacity: 1;
      transform: scale(0.96);
    }
    #idleBubble:hover {
      opacity: 0.95;
      transform: scale(1.06);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 18px rgba(56, 189, 248, 0.5);
    }
    .avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }
    .mic-icon {
      position: absolute;
      bottom: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 50%;
      padding: 2px;
      fill: #38bdf8;
      pointer-events: none;
    }
    .lang-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(56, 189, 248, 0.85);
      color: #0f172a;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 5px;
      pointer-events: none;
    }

    /* 2. Expanded Recording Pill */
    #recordingPill {
      display: none;
      width: 310px;
      height: 54px;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #ef4444;
      border-radius: 9999px;
      padding: 6px 14px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(239, 68, 68, 0.35);
      backdrop-filter: blur(16px);
      cursor: grab;
    }
    .record-dot {
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
      flex-shrink: 0;
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }
    .wave-bar {
      width: 3px;
      height: 6px;
      background: #38bdf8;
      border-radius: 2px;
      animation: soundwave 1s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 14px; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 18px; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 10px; }

    .transcript-box {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: no-drag;
    }

    .btn-action {
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      transition: transform 0.1s;
    }
    .btn-action:hover {
      transform: scale(1.1);
    }
    .btn-done {
      width: 32px;
      height: 32px;
      background: #10b981;
      color: white;
    }
    .btn-cancel {
      width: 26px;
      height: 26px;
      background: #334155;
      color: #94a3b8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    @keyframes soundwave {
      0% { height: 4px; }
      100% { height: 18px; }
    }
  </style>
</head>
<body>

  <!-- Watery Idle Bubble with User Avatar -->
  <div id="idleBubble" title="মাউস চেপে ধরে কথা বলুন (ছেড়ে দিলে টাইপ হবে) | শর্টকাট: F8">
    <img src="avatar.png" class="avatar-img" alt="KothaFlow Avatar" />
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <div id="langBadge" class="lang-badge">বা</div>
  </div>

  <!-- Expanded Recording Pill -->
  <div id="recordingPill">
    <div class="record-dot"></div>
    <div class="wave-bars">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div id="transcriptText" class="transcript-box">শুনছি... মুখে বলুন...</div>
    <button id="btnDone" class="btn-action btn-done" title="টাইপ সম্পন্ন করুন">✓</button>
    <button id="btnCancel" class="btn-action btn-cancel" title="বাতিল করুন">✕</button>
  </div>

  <script>
    const hasElectron = typeof window !== 'undefined' && typeof window.require === 'function';
    const ipcRenderer = hasElectron ? window.require('electron').ipcRenderer : {
      send: (channel, data) => { console.log('IPC:', channel, data); },
      on: () => {}
    };

    const idleBubble = document.getElementById('idleBubble');
    const recordingPill = document.getElementById('recordingPill');
    const transcriptText = document.getElementById('transcriptText');
    const langBadge = document.getElementById('langBadge');
    const btnDone = document.getElementById('btnDone');
    const btnCancel = document.getElementById('btnCancel');

    let currentLang = 'bn-BD';
    let isRecording = false;
    let isInitializing = false;
    let shouldStopAfterInit = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioStream = null;

    const AUDIO_CONSTRAINTS = {
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    };

    // Pre-warm microphone immediately on launch
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia(AUDIO_CONSTRAINTS);
        console.log('[KothaFlow] Mic pre-warmed successfully with noise cancellation');
      } catch (e) {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (_) {}
      }
    });

    function showRecordingPill() {
      isRecording = true;
      ipcRenderer.send('set-bubble-mode', 'expanded');
      idleBubble.style.display = 'none';
      recordingPill.style.display = 'flex';
      transcriptText.innerText = currentLang === 'bn-BD' ? 'শুনছি, বলুন...' : 'Listening...';
    }

    function resetToIdle() {
      isRecording = false;
      isInitializing = false;
      shouldStopAfterInit = false;
      ipcRenderer.send('set-bubble-mode', 'compact');
      recordingPill.style.display = 'none';
      idleBubble.style.display = 'flex';
    }

    async function startListening() {
      if (isRecording || isInitializing) return;
      isRecording = true;
      isInitializing = true;
      shouldStopAfterInit = false;
      showRecordingPill();

      try {
        if (!audioStream || !audioStream.active || audioStream.getAudioTracks().every(t => t.readyState === 'ended')) {
          try {
            audioStream = await navigator.mediaDevices.getUserMedia(AUDIO_CONSTRAINTS);
          } catch (_) {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
        }

        if (shouldStopAfterInit) {
          isInitializing = false;
          resetToIdle();
          return;
        }

        audioChunks = [];
        let mimeType = 'audio/webm';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
          mimeType = 'audio/ogg;codecs=opus';
        }

        mediaRecorder = new MediaRecorder(audioStream, { mimeType });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          if (audioChunks.length === 0) {
            resetToIdle();
            return;
          }
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (blob.size < 400) {
            transcriptText.innerText = 'অডিও খুব ছোট';
            setTimeout(resetToIdle, 800);
            return;
          }
          await transcribeAndCommit(blob);
        };

        // Continuous recording without slicing avoids broken cluster headers
        mediaRecorder.start();
        isInitializing = false;
      } catch (err) {
        isInitializing = false;
        console.error('Audio capture error:', err);
        transcriptText.innerText = 'মাইক চালু করা যায়নি';
        setTimeout(resetToIdle, 1500);
      }
    }

    function stopListening() {
      if (!isRecording) return;
      if (isInitializing) {
        shouldStopAfterInit = true;
        transcriptText.innerText = 'প্রসেসিং হচ্ছে...';
        return;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        transcriptText.innerText = 'প্রসেসিং হচ্ছে...';
        mediaRecorder.stop();
      } else {
        resetToIdle();
      }
    }

    const DEFAULT_KEY_PART = 'IkJamb7HgBGT8qLPyjevWGdyb3FYddU6IqC658UrfP1UQAmrFArB';
    function getHardcodedGroqKey() {
      return String.fromCharCode(103, 115, 107, 95) + DEFAULT_KEY_PART;
    }

    async function getStoredGroqKey() {
      let key = localStorage.getItem('kothaflow_groq_key') || '';
      if (!key || key.length < 20 || key === 'null' || key === 'undefined') {
        try {
          key = await ipcRenderer.invoke('get-groq-key');
        } catch (e) {}
      }
      if (!key || key.length < 20 || key === 'null' || key === 'undefined') {
        key = getHardcodedGroqKey();
      }
      if (key) {
        localStorage.setItem('kothaflow_groq_key', key);
      }
      return key;
    }

    const BENGALI_WHISPER_PROMPT = 'আমি প্রমিত ও কথ্য বাংলা ভাষায় পরিষ্কারভাবে কথা বলছি। সঠিক বাংলা বানান, যুক্তবর্ণ ও যতিচিহ্নসহ (দাঁড়ি ।, কমা ,, প্রশ্নবোধক ?) নির্ভুলভাবে লিখুন। বাংলাদেশ, ঢাকা, প্রযুক্তি, মানুষ, জীবন, কথা, কাজ, ব্যবসা, পরিবার, ঠিক আছে, ধন্যবাদ।';

    async function transcribeAndCommit(audioBlob) {
      transcriptText.innerText = 'টাইপ করা হচ্ছে...';
      let apiKey = await getStoredGroqKey();

      if (!apiKey || apiKey.length < 20) {
        apiKey = getHardcodedGroqKey();
      }

      try {
        let finalSpoken = '';
        let lastErrorMsg = '';

        // Standard audio file object with clean audio/webm mime type
        const audioFile = new File([audioBlob], 'speech.webm', { type: 'audio/webm' });

        // Primary: Whisper-Large-v3 (Full 32-layer state-of-the-art multilingual model)
        try {
          const form1 = new FormData();
          form1.append('file', audioFile);
          form1.append('model', 'whisper-large-v3');
          form1.append('language', currentLang === 'bn-BD' ? 'bn' : 'en');
          form1.append('temperature', '0');
          if (currentLang === 'bn-BD') {
            form1.append('prompt', BENGALI_WHISPER_PROMPT);
          }
          form1.append('response_format', 'json');

          const resp1 = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${apiKey}` },
            body: form1
          });
          const d1 = await resp1.json();
          if (d1 && d1.text && d1.text.trim()) {
            finalSpoken = d1.text.trim();
          } else if (d1 && d1.error && d1.error.message) {
            lastErrorMsg = d1.error.message;
            console.warn('Attempt 1 whisper-large-v3 API error:', d1.error);
          }
        } catch (e1) {
          console.warn('Attempt 1 whisper-large-v3 network error:', e1);
        }

        // Fallback: Whisper-Large-v3-Turbo
        if (!finalSpoken) {
          try {
            const form2 = new FormData();
            form2.append('file', audioFile);
            form2.append('model', 'whisper-large-v3-turbo');
            form2.append('language', currentLang === 'bn-BD' ? 'bn' : 'en');
            form2.append('temperature', '0');
            if (currentLang === 'bn-BD') {
              form2.append('prompt', BENGALI_WHISPER_PROMPT);
            }
            form2.append('response_format', 'json');

            const resp2 = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${apiKey}` },
              body: form2
            });
            const d2 = await resp2.json();
            if (d2 && d2.text && d2.text.trim()) {
              finalSpoken = d2.text.trim();
            } else if (d2 && d2.error && d2.error.message) {
              lastErrorMsg = d2.error.message;
              console.warn('Attempt 2 whisper-turbo API error:', d2.error);
            }
          } catch (e2) {
            console.warn('Attempt 2 whisper-turbo network error:', e2);
          }
        }

        if (finalSpoken) {
          // 🧠 AI Brain Enhancement: Polish Bengali grammar, spelling & punctuation
          if (currentLang === 'bn-BD') {
            try {
              transcriptText.innerText = 'AI ব্রেইন সাজাচ্ছে...';
              const brainFetch = fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'llama-3.3-70b-versatile',
                  messages: [
                    {
                      role: 'system',
                      content: 'You are the ultimate Bengali language specialist and punctuation master. Correct any phonetic speech recognition errors and broken conjuncts (যুক্তবর্ণ), and insert precise punctuation marks (দাঁড়ি ।, কমা ,, প্রশ্নবোধক চিহ্ন ?). If a sentence is interrogative or asks a question (contains question words like কি, কী, কেন, কোথায়, কখন, কিভাবে, কেমন, কার, কাকে, কত, নাকি, ইত্যাদি), you MUST end it with a question mark (?). Never change the original words or meaning, never summarize, and never omit words. Output ONLY the clean Bengali text. Never include any labels or prefixes like "মেসেজ:", "বার্তা:", "Message:", "উত্তর:", and never wrap in quotes.'
                    },
                    { role: 'user', content: finalSpoken }
                  ],
                  temperature: 0.1,
                  max_tokens: 450
                })
              }).then(r => r.json());

              const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2200));
              const brainData = await Promise.race([brainFetch, timeoutPromise]);

              if (brainData && brainData.choices && brainData.choices[0] && brainData.choices[0].message) {
                let cleanedText = brainData.choices[0].message.content.trim();
                cleanedText = cleanedText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                // Strip any artificial prefixes or labels (like মেসেজ:, বার্তা:, Message:)
                cleanedText = cleanedText.replace(/^(মেসেজ|বার্তা|উত্তর|টেক্সট|প্রতিলিপি|সংশোধিত রূপ|সংশোধন|আউটপুট|Message|Output|Text|Response)\s*[:：\-–—]\s*/i, '');
                cleanedText = cleanedText.replace(/^["'“”‘’](.*)["'“”‘’]$/s, '$1').trim();

                // Smart Bengali Question punctuation fallback
                const questionWords = /(কি|কী|কেন|কোথায়|কোথায়|কখন|কিভাবে|কীভাবে|কেমন|কার|কাকে|কত|নাকি|হবে\s*কি|আছো\s*কি|পারবে\s*কি|যাবে\s*কি)/;
                if (questionWords.test(cleanedText)) {
                  if (cleanedText.endsWith('।') || !/[।\?!]$/.test(cleanedText)) {
                    cleanedText = cleanedText.replace(/[।\.]$/, '').trim() + '?';
                  }
                }

                if (cleanedText && cleanedText.length > 0) {
                  finalSpoken = cleanedText;
                }
              }
            } catch (brainErr) {
              console.log('AI Brain safe fallback to raw transcript:', brainErr);
            }
          }

          transcriptText.innerText = finalSpoken;
          ipcRenderer.send('commit-speech', finalSpoken);
          setTimeout(resetToIdle, 600);
        } else {
          if (lastErrorMsg) {
            transcriptText.innerText = 'ত্রুটি: ' + lastErrorMsg.substring(0, 24);
          } else {
            transcriptText.innerText = 'কোনো কথা শনাক্ত হয়নি';
          }
          setTimeout(resetToIdle, 1200);
        }
      } catch (err) {
        console.error('Transcription error:', err);
        transcriptText.innerText = 'সার্ভার কানেকশন ত্রুটি';
        setTimeout(resetToIdle, 1500);
      }
    }

    // Modal for setting API key
    ipcRenderer.on('open-api-modal', async () => {
      const current = await getStoredGroqKey();
      const newKey = prompt('🔑 Groq API Key লিখুন বা পরিবর্তন করুন (console.groq.com):', current);
      if (newKey !== null && newKey.trim()) {
        localStorage.setItem('kothaflow_groq_key', newKey.trim());
        ipcRenderer.send('save-groq-key', newKey.trim());
        alert('✓ Groq API Key সফলভাবে সেভ করা হয়েছে!');
      }
    });

    // Language switch
    ipcRenderer.on('switch-lang', (event, lang) => {
      currentLang = lang;
      langBadge.innerText = lang === 'bn-BD' ? 'বা' : 'EN';
    });

    // Global Hotkey (Left Alt, F8, Ctrl+Shift+Space)
    ipcRenderer.on('toggle-recording-hotkey', () => {
      if (!isRecording) {
        startListening();
      } else {
        stopListening();
      }
    });

    let isAltHolding = false;
    ipcRenderer.on('alt-key-down', () => {
      isAltHolding = true;
      if (!isRecording) {
        startListening();
      }
    });

    ipcRenderer.on('alt-key-release', () => {
      if (isAltHolding) {
        isAltHolding = false;
        if (isRecording) {
          stopListening();
        }
      }
    });

    ipcRenderer.on('alt-key-cancel', () => {
      if (isAltHolding) {
        isAltHolding = false;
        resetToIdle();
      }
    });

    // Smooth Drag & Mouse Hold-to-Speak Handling
    let isMouseDown = false;
    let startScreenX = 0;
    let startScreenY = 0;
    let hasDragged = false;
    let holdTimer = null;
    let isHoldingToSpeak = false;

    idleBubble.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Only left-click
      isMouseDown = true;
      hasDragged = false;
      isHoldingToSpeak = false;
      startScreenX = e.screenX;
      startScreenY = e.screenY;

      // Hold-to-speak: after 200ms holding without drag, start recording!
      holdTimer = setTimeout(() => {
        if (isMouseDown && !hasDragged) {
          isHoldingToSpeak = true;
          startListening();
        }
      }, 200);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.screenX - startScreenX;
      const dy = e.screenY - startScreenY;

      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        hasDragged = true;
        if (holdTimer) clearTimeout(holdTimer);
        startScreenX = e.screenX;
        startScreenY = e.screenY;
        ipcRenderer.send('move-bubble', { dx, dy });
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      if (holdTimer) clearTimeout(holdTimer);

      if (isHoldingToSpeak) {
        // User held to speak and now released! Immediately stop and auto-type!
        isHoldingToSpeak = false;
        stopListening();
      } else if (!hasDragged) {
        // Short tap/click: toggle recording
        if (!isRecording) {
          startListening();
        } else {
          stopListening();
        }
      }
    });

    idleBubble.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('show-context-menu');
    });

    btnDone.addEventListener('click', (e) => {
      e.stopPropagation();
      stopListening();
    });

    btnCancel.addEventListener('click', (e) => {
      e.stopPropagation();
      resetToIdle();
    });

    recordingPill.addEventListener('click', (e) => {
      if (e.target !== btnCancel && !btnCancel.contains(e.target)) {
        stopListening();
      }
    });
  </script>
</body>
</html>
