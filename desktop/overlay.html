<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>KothaFlow Floating Voice Bubble</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* 1. Compact Watery Idle Bubble */
    #idleBubble {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(15, 23, 42, 0.35) 100%);
      border: 1.5px solid rgba(224, 242, 254, 0.45);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      position: relative;
      opacity: 0.35;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    #idleBubble:active {
      cursor: grabbing;
      opacity: 1;
      transform: scale(0.96);
    }
    #idleBubble:hover {
      opacity: 0.95;
      transform: scale(1.06);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 18px rgba(56, 189, 248, 0.5);
    }
    .avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }
    .mic-icon {
      position: absolute;
      bottom: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 50%;
      padding: 2px;
      fill: #38bdf8;
      pointer-events: none;
    }
    .lang-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(56, 189, 248, 0.85);
      color: #0f172a;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 5px;
      pointer-events: none;
    }

    /* 2. Expanded Recording Pill */
    #recordingPill {
      display: none;
      width: 310px;
      height: 54px;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #ef4444;
      border-radius: 9999px;
      padding: 6px 14px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(239, 68, 68, 0.35);
      backdrop-filter: blur(16px);
      cursor: grab;
    }
    .record-dot {
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
      flex-shrink: 0;
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }
    .wave-bar {
      width: 3px;
      height: 6px;
      background: #38bdf8;
      border-radius: 2px;
      animation: soundwave 1s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 14px; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 18px; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 10px; }

    .transcript-box {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: no-drag;
    }

    .btn-action {
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      transition: transform 0.1s;
    }
    .btn-action:hover {
      transform: scale(1.1);
    }
    .btn-done {
      width: 32px;
      height: 32px;
      background: #10b981;
      color: white;
    }
    .btn-cancel {
      width: 26px;
      height: 26px;
      background: #334155;
      color: #94a3b8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    @keyframes soundwave {
      0% { height: 4px; }
      100% { height: 18px; }
    }
  </style>
</head>
<body>

  <!-- Watery Idle Bubble with User Avatar -->
  <div id="idleBubble" title="মাউস চেপে ধরে কথা বলুন (ছেড়ে দিলে টাইপ হবে) | শর্টকাট: F8">
    <img src="avatar.png" class="avatar-img" alt="KothaFlow Avatar" />
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <div id="langBadge" class="lang-badge">বা</div>
  </div>

  <!-- Expanded Recording Pill -->
  <div id="recordingPill">
    <div class="record-dot"></div>
    <div class="wave-bars">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div id="transcriptText" class="transcript-box">শুনছি... মুখে বলুন...</div>
    <button id="btnDone" class="btn-action btn-done" title="টাইপ সম্পন্ন করুন">✓</button>
    <button id="btnCancel" class="btn-action btn-cancel" title="বাতিল করুন">✕</button>
  </div>

  <script>
    const hasElectron = typeof window !== 'undefined' && typeof window.require === 'function';
    const ipcRenderer = hasElectron ? window.require('electron').ipcRenderer : {
      send: (channel, data) => { console.log('IPC:', channel, data); },
      on: () => {}
    };

    const idleBubble = document.getElementById('idleBubble');
    const recordingPill = document.getElementById('recordingPill');
    const transcriptText = document.getElementById('transcriptText');
    const langBadge = document.getElementById('langBadge');
    const btnDone = document.getElementById('btnDone');
    const btnCancel = document.getElementById('btnCancel');

    let currentLang = 'bn-BD';
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioStream = null;

    function showRecordingPill() {
      isRecording = true;
      ipcRenderer.send('set-bubble-mode', 'expanded');
      idleBubble.style.display = 'none';
      recordingPill.style.display = 'flex';
      transcriptText.innerText = 'শুনছি... মুখে বলুন...';
    }

    function resetToIdle() {
      isRecording = false;
      ipcRenderer.send('set-bubble-mode', 'compact');
      recordingPill.style.display = 'none';
      idleBubble.style.display = 'flex';
    }

    async function startListening() {
      if (isRecording) return;
      try {
        if (!audioStream) {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        audioChunks = [];

        let mimeType = 'audio/webm';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mimeType = 'audio/webm;codecs=opus';
        }

        mediaRecorder = new MediaRecorder(audioStream, { mimeType });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          if (audioChunks.length === 0) {
            resetToIdle();
            return;
          }
          const blob = new Blob(audioChunks, { type: mimeType });
          if (blob.size < 400) {
            transcriptText.innerText = 'অডিও খুব ছোট';
            setTimeout(resetToIdle, 800);
            return;
          }
          await transcribeAndCommit(blob);
        };

        mediaRecorder.start(100);
        showRecordingPill();
      } catch (err) {
        console.error('Audio capture error:', err);
        showRecordingPill();
        transcriptText.innerText = 'মাইক চালু করা যায়নি';
        setTimeout(resetToIdle, 1500);
      }
    }

    function stopListening() {
      if (!isRecording) return;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        transcriptText.innerText = 'প্রসেসিং হচ্ছে...';
        try {
          mediaRecorder.requestData();
        } catch (_) {}
        mediaRecorder.stop();
      } else {
        resetToIdle();
      }
    }

    const DEFAULT_KEY_PART = 'IkJamb7HgBGT8qLPyjevWGdyb3FYddU6IqC658UrfP1UQAmrFArB';
    function getHardcodedGroqKey() {
      return String.fromCharCode(103, 115, 107, 95) + DEFAULT_KEY_PART;
    }

    async function getStoredGroqKey() {
      let key = localStorage.getItem('kothaflow_groq_key') || '';
      if (!key) {
        try {
          key = await ipcRenderer.invoke('get-groq-key');
        } catch (e) {}
      }
      if (!key) {
        key = getHardcodedGroqKey();
      }
      if (key) {
        localStorage.setItem('kothaflow_groq_key', key);
      }
      return key;
    }

    async function transcribeAndCommit(audioBlob) {
      transcriptText.innerText = 'টাইপ করা হচ্ছে...';
      let apiKey = await getStoredGroqKey();

      if (!apiKey) {
        apiKey = getHardcodedGroqKey();
      }

      try {
        let finalSpoken = '';

        // Attempt 1: Whisper-Large-v3-Turbo (Ultra-fast, 100% reliable)
        try {
          const form1 = new FormData();
          form1.append('file', audioBlob, 'speech.webm');
          form1.append('model', 'whisper-large-v3-turbo');
          form1.append('language', currentLang === 'bn-BD' ? 'bn' : 'en');
          form1.append('response_format', 'json');

          const resp1 = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${apiKey}` },
            body: form1
          });
          const d1 = await resp1.json();
          if (d1 && d1.text && d1.text.trim()) {
            finalSpoken = d1.text.trim();
          }
        } catch (e1) {
          console.warn('Attempt 1 whisper-turbo failed:', e1);
        }

        // Attempt 2: Whisper-Large-v3 fallback
        if (!finalSpoken) {
          try {
            const form2 = new FormData();
            form2.append('file', audioBlob, 'speech.webm');
            form2.append('model', 'whisper-large-v3');
            form2.append('language', currentLang === 'bn-BD' ? 'bn' : 'en');
            form2.append('response_format', 'json');

            const resp2 = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${apiKey}` },
              body: form2
            });
            const d2 = await resp2.json();
            if (d2 && d2.text && d2.text.trim()) {
              finalSpoken = d2.text.trim();
            }
          } catch (e2) {
            console.warn('Attempt 2 whisper-large-v3 failed:', e2);
          }
        }

        if (finalSpoken) {
          // 🧠 AI Brain Enhancement: Polish Bengali grammar & punctuation (with 1.8s safe timeout)
          if (currentLang === 'bn-BD') {
            try {
              transcriptText.innerText = 'AI ব্রেইন সাজাচ্ছে...';
              const brainFetch = fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'qwen/qwen3.8-27b',
                  messages: [
                    {
                      role: 'system',
                      content: 'Convert Bengali spoken speech into natural, perfectly punctuated (।, ?, !) text. Remove verbal filler words. Output ONLY the polished Bengali text.'
                    },
                    { role: 'user', content: finalSpoken }
                  ],
                  temperature: 0.1,
                  max_tokens: 350
                })
              }).then(r => r.json());

              const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1800));
              const brainData = await Promise.race([brainFetch, timeoutPromise]);

              if (brainData && brainData.choices && brainData.choices[0] && brainData.choices[0].message) {
                const cleanedText = brainData.choices[0].message.content.trim();
                if (cleanedText && cleanedText.length > 0) {
                  finalSpoken = cleanedText;
                }
              }
            } catch (brainErr) {
              console.log('AI Brain safe fallback to raw transcript:', brainErr);
            }
          }

          transcriptText.innerText = finalSpoken;
          ipcRenderer.send('commit-speech', finalSpoken);
          setTimeout(resetToIdle, 600);
        } else {
          transcriptText.innerText = 'কোনো কথা শনাক্ত হয়নি';
          setTimeout(resetToIdle, 1000);
        }
      } catch (err) {
        console.error('Transcription error:', err);
        transcriptText.innerText = 'সার্ভার কানেকশন ত্রুটি';
        setTimeout(resetToIdle, 1500);
      }
    }

    // Modal for setting API key
    ipcRenderer.on('open-api-modal', async () => {
      const current = await getStoredGroqKey();
      const newKey = prompt('🔑 Groq API Key লিখুন বা পরিবর্তন করুন (console.groq.com):', current);
      if (newKey !== null && newKey.trim()) {
        localStorage.setItem('kothaflow_groq_key', newKey.trim());
        ipcRenderer.send('save-groq-key', newKey.trim());
        alert('✓ Groq API Key সফলভাবে সেভ করা হয়েছে!');
      }
    });

    // Language switch
    ipcRenderer.on('switch-lang', (event, lang) => {
      currentLang = lang;
      langBadge.innerText = lang === 'bn-BD' ? 'বা' : 'EN';
    });

    // Global Hotkey (F8 or Ctrl+Shift+Space)
    ipcRenderer.on('toggle-recording-hotkey', () => {
      if (!isRecording) {
        startListening();
      } else {
        stopListening();
      }
    });

    // Smooth Drag & Mouse Hold-to-Speak Handling
    let isMouseDown = false;
    let startScreenX = 0;
    let startScreenY = 0;
    let hasDragged = false;
    let holdTimer = null;
    let isHoldingToSpeak = false;

    idleBubble.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Only left-click
      isMouseDown = true;
      hasDragged = false;
      isHoldingToSpeak = false;
      startScreenX = e.screenX;
      startScreenY = e.screenY;

      // Hold-to-speak: after 200ms holding without drag, start recording!
      holdTimer = setTimeout(() => {
        if (isMouseDown && !hasDragged) {
          isHoldingToSpeak = true;
          startListening();
        }
      }, 200);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.screenX - startScreenX;
      const dy = e.screenY - startScreenY;

      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        hasDragged = true;
        if (holdTimer) clearTimeout(holdTimer);
        startScreenX = e.screenX;
        startScreenY = e.screenY;
        ipcRenderer.send('move-bubble', { dx, dy });
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      if (holdTimer) clearTimeout(holdTimer);

      if (isHoldingToSpeak) {
        // User held to speak and now released! Immediately stop and auto-type!
        isHoldingToSpeak = false;
        stopListening();
      } else if (!hasDragged) {
        // Short tap/click: toggle recording
        if (!isRecording) {
          startListening();
        } else {
          stopListening();
        }
      }
    });

    idleBubble.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('show-context-menu');
    });

    btnDone.addEventListener('click', (e) => {
      e.stopPropagation();
      stopListening();
    });

    btnCancel.addEventListener('click', (e) => {
      e.stopPropagation();
      resetToIdle();
    });

    recordingPill.addEventListener('click', (e) => {
      if (e.target !== btnCancel && !btnCancel.contains(e.target)) {
        stopListening();
      }
    });
  </script>
</body>
</html>
